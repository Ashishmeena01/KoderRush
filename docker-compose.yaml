services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hostelhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: hostelhub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

