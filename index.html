<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caddy Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       shadcn/ui Design System Tokens (Monochrome / Zinc Palette)
       ------------------------------------------------------------- */
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
      --radius: 0.5rem;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html.dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --popover: 240 10% 3.9%;
      --popover-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
    }

    /* -------------------------------------------------------------
       Base Reset & Global Styles
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* -------------------------------------------------------------
       shadcn Component: Badge
       ------------------------------------------------------------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 9999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1;
      width: fit-content;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .badge-outline {
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground));
      background-color: transparent;
    }

    .badge-secondary {
      background-color: hsl(var(--secondary));
      color: hsl(var(--secondary-foreground));
      border: 1px solid transparent;
    }

    .badge-default {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border: 1px solid transparent;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* -------------------------------------------------------------
       shadcn Component: Button
       ------------------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
      border-radius: calc(var(--radius) - 2px);
      font-size: 0.875rem;
      font-weight: 500;
      height: 2.25rem;
      padding: 0 0.875rem;
      transition: all 0.15s ease;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      outline: none;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring));
    }

    .btn-default {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border: 1px solid transparent;
    }

    .btn-default:hover {
      opacity: 0.88;
    }

    .btn-outline {
      background-color: transparent;
      color: hsl(var(--foreground));
      border: 1px solid hsl(var(--border));
    }

    .btn-outline:hover {
      background-color: hsl(var(--accent));
      color: hsl(var(--accent-foreground));
    }

    .btn-secondary {
      background-color: hsl(var(--secondary));
      color: hsl(var(--secondary-foreground));
      border: 1px solid transparent;
    }

    .btn-secondary:hover {
      opacity: 0.85;
    }

    .btn-ghost {
      background-color: transparent;
      color: hsl(var(--foreground));
      border: 1px solid transparent;
    }

    .btn-ghost:hover {
      background-color: hsl(var(--accent));
      color: hsl(var(--accent-foreground));
    }

    .btn-sm {
      height: 2rem;
      padding: 0 0.65rem;
      font-size: 0.8125rem;
      border-radius: calc(var(--radius) - 3px);
    }

    .btn-icon {
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
    }

    /* -------------------------------------------------------------
       shadcn Component: Card
       ------------------------------------------------------------- */
    .card {
      border-radius: var(--radius);
      border: 1px solid hsl(var(--border));
      background-color: hsl(var(--card));
      color: hsl(var(--card-foreground));
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: hsl(var(--foreground) / 0.25);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1.5rem 1.5rem 0.75rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-description {
      font-size: 0.8125rem;
      color: hsl(var(--muted-foreground));
      line-height: 1.4;
    }

    .card-content {
      padding: 0.75rem 1.5rem;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem 1.25rem;
      border-top: 1px solid hsl(var(--border));
      font-size: 0.8125rem;
      color: hsl(var(--muted-foreground));
    }

    /* -------------------------------------------------------------
       shadcn Component: Tabs
       ------------------------------------------------------------- */
    .tabs-list {
      display: inline-flex;
      height: 2.25rem;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--radius) - 2px);
      background-color: hsl(var(--muted));
      padding: 0.25rem;
      color: hsl(var(--muted-foreground));
      gap: 0.25rem;
      width: fit-content;
    }

    .tabs-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: calc(var(--radius) - 4px);
      padding: 0.3rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tabs-trigger.active {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.08);
    }

    .tabs-content {
      display: none;
      margin-top: 1.5rem;
    }

    .tabs-content.active {
      display: block;
    }

    /* -------------------------------------------------------------
       shadcn Component: Separator
       ------------------------------------------------------------- */
    .separator {
